<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Meet your next favorite. Prizify is your independent space for music discovery, playlists, and a little everyday escape.">
  <title>Prizify — Find your frequency</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a href="#content" class="skip-link">Skip to music</a>
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" href="#home" aria-label="Prizify home"><svg viewBox="0 0 36 38" aria-hidden="true"><path d="M8 32V7h12a10 10 0 0 1 0 20h-4v-8h4a2 2 0 0 0 0-4h-4v17z" fill="currentColor"/><path d="m26 28 5 4-5 4z" fill="currentColor"/></svg>prizify<span>®</span></a>
    <div class="nav-label">DISCOVER</div>
    <nav id="main-nav"></nav>
    <div class="library-heading"><span class="nav-label">YOUR COLLECTION</span><button class="icon-button" data-action="create-playlist" title="Create a playlist" aria-label="Create a playlist" id="sidebar-create"></button></div>
    <a href="#liked" class="collection-link"><span class="liked-tile" id="liked-icon"></span><span>Liked songs<small id="liked-count">Your favorites, together</small></span></a>
    <div id="sidebar-playlists"></div>
    <div class="sidebar-bottom"><div class="frequency-bars"><i></i><i></i><i></i><i></i><i></i></div><strong>A little less noise.<br>A little more music.</strong><p>Your own corner of sound.</p><button class="demo-badge" data-action="about">ORIGINAL DEMO <span>↗</span></button></div>
    <button class="profile" data-action="profile"><span class="avatar">Y</span><span>Your space<small>Made for good listening</small></span><span class="profile-more">···</span></button>
  </aside>
  <div class="workspace">
    <header class="topbar"><a class="mobile-brand" href="#home" aria-label="Prizify home"><svg viewBox="0 0 36 38" aria-hidden="true"><path d="M8 32V7h12a10 10 0 0 1 0 20h-4v-8h4a2 2 0 0 0 0-4h-4v17z" fill="currentColor"/></svg>prizify</a><div class="breadcrumbs"><button class="icon-button" data-action="back" aria-label="Go back" id="back-button"></button><span id="breadcrumb">Discover <span>/</span> Home</span></div><div class="topbar-tools"><label class="search-box" id="top-search-label"><span id="search-icon"></span><input type="search" id="global-search" autocomplete="off" placeholder="What do you want to listen to?" aria-label="Search music"><kbd>/</kbd></label><button class="icon-button notification-button" data-action="activity" aria-label="What's new" id="notification-icon"></button><button class="avatar small-avatar" data-action="profile" aria-label="Your profile">Y</button></div></header>
    <main id="content" tabindex="-1"></main>
    <footer class="page-footer"><span class="footer-logo">prizify</span><span>Find your frequency.</span><button data-action="about">About this demo <span>↗</span></button></footer>
  </div>
  <aside id="queue-panel" class="queue-panel" aria-label="Play queue" hidden></aside>
  <section class="player" aria-label="Music player"><div class="now-playing"><button class="playing-art" id="player-art" data-action="now-playing" aria-label="Open now playing and all playback controls"></button><div class="playing-meta"><button id="player-title" data-action="open-current">Afterglow</button><span id="player-artist">Solstice Club</span></div><button class="icon-button" data-action="like-current" id="player-like" aria-label="Save current track"></button></div><div class="transport"><div class="transport-buttons"><button class="icon-button" data-action="shuffle" id="shuffle" aria-label="Shuffle" aria-pressed="false"></button><button class="icon-button" data-action="previous" id="previous" aria-label="Previous track"></button><button class="main-play" data-action="toggle-play" id="play-pause" aria-label="Play"></button><button class="icon-button" data-action="next" id="next" aria-label="Next track"></button><button class="icon-button" data-action="repeat" id="repeat" aria-label="Repeat off" aria-pressed="false"></button></div><div class="seek-row"><time id="elapsed">0:00</time><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek through track"><time id="duration">1:04</time></div></div><div class="player-tools"><span class="demo-label"><span></span>DEMO AUDIO</span><button class="icon-button" data-action="queue" aria-label="Open queue" id="queue-button" aria-expanded="false"></button><span class="tool-divider"></span><button class="icon-button" data-action="mute" id="mute" aria-label="Mute"></button><input type="range" id="volume" min="0" max="1" step="0.01" value="0.7" aria-label="Volume"><button class="icon-button expand-button" data-action="now-playing" aria-label="Expand now playing" id="expand"></button></div></section>
  <nav class="mobile-nav" aria-label="Mobile navigation"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <audio id="audio" preload="metadata"></audio>
  <script src="./app.js" type="module"></script>
</body>
</html>
